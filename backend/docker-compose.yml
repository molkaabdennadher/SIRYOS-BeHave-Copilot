version: "3.8"
services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    container_name: behave-pgvector
    environment:
      POSTGRES_DB: behave_chatbot
      POSTGRES_USER: behave
      POSTGRES_PASSWORD: behave_pwd
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
